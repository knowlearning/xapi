authorize:
  sameDomain:
    postgres: same_domain_authorization
  crossDomain:
    postgres: cross_domain_authorization
postgres:
  tables:
    statements:
      type: application/json;type=xapi-statement
      columns:
        source: TEXT
        actor: TEXT
        verb: TEXT
        object: TEXT
        embed_path: TEXT[]
        authority: TEXT
        domain: TEXT
        score_scaled: DECIMAL
        score_raw: DECIMAL
        score_min: DECIMAL
        score_max: DECIMAL
        success: BOOLEAN
        completion: BOOLEAN
        response: TEXT
#       duration:
        extensions: JSONB
      indices:
        authority:
          column: authority
        # embed_path:
        #   gin: true
        #   column: embed_path
  functions:
    same_domain_authorization:
      returns: BOOLEAN
      language: PLpgSQL
      body: |
        BEGIN
          RETURN TRUE;
        END;
      arguments:
      - name: requestingUser
        type: TEXT
      - name: requestedScope
        type: TEXT
    cross_domain_authorization:
      returns: BOOLEAN
      language: PLpgSQL
      body: |
        BEGIN
          RETURN TRUE;
        END;
      arguments:
      - name: requestingDomain
        type: TEXT
      - name: requestingUser
        type: TEXT
      - name: requestedScope
        type: TEXT
  queries:
    search-translations: SELECT * FROM statements LIMIT 1
    my-statements:
      domains:
        - f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f.localhost:5888
        - c0f3a481-d4d5-4133-a198-94a325aa4536.localhost:6061
        - create.pilaproject.org
        - thailand.pilaproject.org
        - dev.gforcesolution.com
        - pila.gforcesolution.com
        - polska-rct-2025.pilaproject.org
        - france-rct-2025.pilaproject.org
        - testing.pilaproject.org
        - app.pilaproject.org
      body: |
        SELECT *
        FROM statements
        WHERE authority = $REQUESTER
          AND (
            $CONTEXT::TEXT[] = '{}'
            OR embed_path[:array_length($CONTEXT::TEXT[], 1)] = $CONTEXT::TEXT[]
          )
    statements:
      domains:
        - localhost:5444
        - c0f3a481-d4d5-4133-a198-94a325aa4536.localhost:5444
        - f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f.localhost:5888
        - c0f3a481-d4d5-4133-a198-94a325aa4536.localhost:6061
        - create.pilaproject.org
        - thailand.pilaproject.org
        - dev.gforcesolution.com
        - pila.gforcesolution.com
        - polska-rct-2025.pilaproject.org
        - france-rct-2025.pilaproject.org
        - testing.pilaproject.org
        - app.pilaproject.org
      body: |
        SELECT
          statements.*,
          metadata.created as stored
        FROM statements
        JOIN metadata ON metadata.id = statements.id
        WHERE authority = ANY($1)
          AND (
            $2::TEXT[] = '{}'
            OR embed_path[:array_length($2::TEXT[], 1)] = $2::TEXT[]
          )
        ORDER BY metadata.created
    statements-in-context:
      domains:
        - f74e9cb3-2b53-4c85-9b0c-f1d61b032b3f.localhost:5656
      body: |
        SELECT
          statements.*,
          metadata.created as stored
        FROM statements
        JOIN metadata ON metadata.id = statements.id
        WHERE $1 = ANY(statements.embed_path)
        ORDER BY metadata.created
    survey-answers: |
      WITH answered AS (
        SELECT
          s.actor                                   AS student_or_teacher_id,
          (s.extensions->'item'->>'name')           AS item_name,
          (s.extensions->'item'->'userData'->>0)    AS item_value,
          m.created::timestamptz AS ts
        FROM statements AS s
        LEFT JOIN metadata AS m ON m.id = s.id
        WHERE s.verb = 'answered'
          AND $1 = ANY(s.embed_path)
          AND (s.extensions->'item'->>'name') IS NOT NULL
          AND (s.extensions->'item'->>'name') <> ''
      ),
      latest AS (
        SELECT DISTINCT ON (student_or_teacher_id, item_name)
          student_or_teacher_id,
          item_name,
          item_value
        FROM answered
        ORDER BY student_or_teacher_id, item_name, ts DESC
      )
      SELECT
        student_or_teacher_id AS "Student or teacher ID",
        jsonb_object_agg(item_name, item_value ORDER BY item_name) AS answers
      FROM latest
      GROUP BY student_or_teacher_id
      ORDER BY "Student or teacher ID"

agent: |
  import Agent from 'npm:@knowlearning/agents/deno.js'

  Agent.on('child', child => {
    const { environment: { user } } = child
    Agent.log(`GOT CHILD CONNECTION!!!!!!!! ${user}`)

    child.on('mutate', async ({ scope, id, patch }) => {
      if (scope.startsWith('xapi/')) {
        Agent.log('GOT A PATCH', scope, id, patch)
        const { source, actor, verb, object, result, context, extensions } = await Agent.state(id)
        const authority = await Agent.metadata(source).then(md => md.owner)

        const active = JSON.parse(JSON.stringify({
          source,
          actor: actor || authority,
          verb,
          object,
          domain: user,
          embed_path: context,
          authority,
          score_scaled: result?.score?.scaled,
          score_raw: result?.score?.raw,
          score_min: result?.score?.min,
          score_max: result?.score?.max,
          success: result?.success,
          completion: result?.completion,
          response: result?.response,
          extensions
        }))

        await Agent.create({
          active_type: 'application/json;type=xapi-statement',
          active
        })
      }
    })
  })
