authorize:
  sameDomain:
    postgres: same_domain_authorization
  crossDomain:
    postgres: cross_domain_authorization
postgres:
  views:
    test_view:
      query: |
        SELECT * FROM metadata
  tables:
    statements:
      type: application/json;type=xapi-statement
      columns:
        origin: TEXT
        actor: TEXT
        verb: TEXT
        object: TEXT
        context: JSONB
        authority: TEXT
        domain: TEXT
        score_scaled: DECIMAL
        score_raw: DECIMAL
        score_min: DECIMAL
        score_max: DECIMAL
        success: BOOLEAN
        completion: BOOLEAN
        response: TEXT
#       duration:
        extensions: JSONB
  functions:
    same_domain_authorization:
      returns: BOOLEAN
      language: PLpgSQL
      body: |
        BEGIN
          RETURN TRUE;
        END;
      arguments:
      - name: requestingUser
        type: TEXT
      - name: requestedScope
        type: TEXT
    cross_domain_authorization:
      returns: BOOLEAN
      language: PLpgSQL
      body: |
        BEGIN
          RETURN TRUE;
        END;
      arguments:
      - name: requestingDomain
        type: TEXT
      - name: requestingUser
        type: TEXT
      - name: requestedScope
        type: TEXT
  queries:
    search-translations: SELECT * FROM statements LIMIT 1
agent: |
  import Agent from 'npm:@knowlearning/agents/deno.js'

  Agent.on('child', child => {
    const { environment: { user } } = child
    Agent.log(`GOT CHILD CONNECTION!!!!!!!! ${user}`)

    child.on('mutate', async ({ scope, id, patch }) => {
      if (scope.startsWith('xapi/')) {
        Agent.log('GOT A PATCH', scope, id, patch)
        const { origin, actor, verb, object, result, context, extensions } = await Agent.state(id)
        const authority = await Agent.metadata(origin).then(md => md.owner)

        const active = JSON.parse(JSON.stringify({
          origin,
          actor: actor || authority,
          verb,
          object,
          domain: user,
          context,
          authority,
          score_scaled: result?.score?.scaled,
          score_raw: result?.score?.raw,
          score_min: result?.score?.min,
          score_max: result?.score?.max,
          success: result?.success,
          completion: result?.completion,
          response: result?.response,
          extensions
        }))

        await Agent.create({
          active_type: 'application/json;type=xapi-statement',
          active
        })
      }
    })
  })
